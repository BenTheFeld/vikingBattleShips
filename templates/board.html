<h2>{{ title }}</h2>
<table>
  {% for row in matrix %}
  {% set row_index = loop.index0 %}
  <tr>
    {% for square in row %}
    <td
      class="{{ square.css_class(hide_ships) }}"
      data-row="{{ row_index }}"
      data-col="{{ loop.index0 }}"
      data-ship="{{ square.shipType if (not hide_ships or square.isHit) else '' }}"
    >
      {% set img = square.image_path(color, hide_ships) %}
      {% if img %}
      <img
        class="ship-img{{ ' rotate' if square.orientation == 'horizontal' else '' }}"
        src="{{ url_for('static', filename=img) }}"
        alt=""
      />
      {% endif %}
      {% if clickable and not square.isHit %}
      <form method="post" action="{{ post_url }}">
        <input type="hidden" name="row" value="{{ row_index }}" />
        <input type="hidden" name="col" value="{{ loop.index0 }}" />
        <button type="submit" aria-label="Fire"></button>
      </form>
      {% endif %}
    </td>
    {% endfor %}
  </tr>
  {% endfor %}
</table>
